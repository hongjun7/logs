<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.subtitle | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/notes.css' | relative_url }}">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('logs-theme') || 'light'; } catch (e) {}</script>
  <script defer src="{{ '/assets/js/notes.js' | relative_url }}"></script>
  {% if page.layout == 'article' %}
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, tags: 'none' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      svg: { fontCache: 'global' },
      startup: {
        pageReady: () => MathJax.startup.defaultPageReady().then(() => {
          // Initial TeX layout changes can shift a directly linked section.
          // Resolve the fragment after typesetting so deep links stay precise.
          if (!location.hash) return;
          try {
            const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            target?.scrollIntoView({ behavior: 'instant', block: 'start' });
          } catch (error) {}
        })
      }
    };
  </script>
  <script defer src="{{ '/assets/js/vendor/tex-svg.js' | relative_url }}"></script>
  {% endif %}
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav aria-label="Main navigation">
      <div class="brand-group"><a class="brand" href="{{ '/' | relative_url }}">Logs<span class="brand-dot">.</span> hongjun7</a><button id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Change theme"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/></svg></button><span class="nav-divider" aria-hidden="true">|</span></div>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/archive.html' | relative_url }}"{% if page.url == '/archive.html' %} aria-current="page"{% endif %}>Archive</a>
        <a href="{{ '/search.html' | relative_url }}"{% if page.url == '/search.html' %} aria-current="page"{% endif %}>Search</a>
        <a href="{{ '/tags.html' | relative_url }}"{% if page.url == '/tags.html' %} aria-current="page"{% endif %}>Tags</a>
        <a href="https://hongjun7.github.io/">About <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </header>
  <main id="main" class="main{% if page.layout == 'article' %} article-main{% endif %}">{{ content }}</main>
  <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</span><span><a href="{{ '/feed.xml' | relative_url }}">RSS</a> · Built with Jekyll</span></footer>
  <a class="back-top" href="#top" aria-label="Back to top">↑</a>
</body>
</html>
